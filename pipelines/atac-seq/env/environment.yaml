# ATAC-seq 流程的 conda 环境定义
#
# 用法
#   conda env create -f env/environment.yaml
#   conda activate atac
#
# 不想全装：deploy/deploy.sh env 会先体检，只把缺的装进已有环境。
# 版本用 >= 而不是 ==，避免和服务器上已装的版本打架。
name: atac
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  # 上游
  - fastqc>=0.11
  - fastp>=0.23
  - bowtie2>=2.5
  - samtools>=1.17
  # peak calling 与区间操作
  - macs2>=2.2
  - bedtools>=2.31
  # 信号与可视化
  - deeptools>=3.5
  # 注释与 motif
  - homer>=4.11
  # 汇总报告
  - multiqc>=1.14
  # 可选：MEME motif（很大，按需装）
  # - meme>=5.5
  # 可选：TOBIAS footprint
  # - tobias>=0.15
  # 可选：ATACseqQC / ChIPpeakAnno（R）
  # - bioconductor-atacseqqc
  # - bioconductor-chippeakanno

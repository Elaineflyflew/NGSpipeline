#!/usr/bin/env bash
# =============================================================================
#  config/genomes/hg38.conf —— hg38 的参考数据位置
#
#  模仿 snakePipes 的 organisms/<name>.yaml：物种相关的路径集中在一个文件里，
#  换物种（比如 mm10）只要新增 config/genomes/mm10.conf，再 --genome mm10，
#  流程代码一行都不用改。
#
#  每一项都用 first_existing 探测多个候选位置，按顺序取第一个存在的；
#  所以同一份配置在 /public/workspace 和 /public/storage 两套课程目录下都能用。
#  想强制指定：export BT2_INDEX=... 或 --bt2-index ...（环境变量 > 本文件）
# =============================================================================

GENOME_NAME="hg38"
GENOME_LABEL="Homo sapiens GRCh38"

# ---------------------------------------------------------------- 比对索引
# bowtie2 的前缀（不带 .1.bt2），不是 fasta 本身
: "${BT2_INDEX:=$(first_existing \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab9/refs/hg38 \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab9/refs/hg38 \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab10/refs/hg38 \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab10/refs/hg38 \
    "$PROJECT_ROOT/reference/genome/hg38")}"

# ---------------------------------------------------------------- 序列
# 给 bedtools getfasta / TOBIAS 用
: "${FASTA:=$(first_existing \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab9/refs/hg38.fa \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab9/refs/hg38.fa \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab11/refs/hg38.fa \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab11/refs/hg38.fa \
    "$PROJECT_ROOT/reference/genome/hg38.fa")}"

# ---------------------------------------------------------------- 黑名单
# ENCODE 的 hg38 blacklist v2：高信号假阳性区域，peak 里要剔掉
: "${BLACKLIST:=$(first_existing \
    /public/workspace/shaojf/Course/NGS/Reference/ENCODE/blacklist.v2/hg38-blacklist.v2.bed \
    /public/storage/shaojf/Course/NGS/Reference/ENCODE/blacklist.v2/hg38-blacklist.v2.bed \
    "$PROJECT_ROOT/reference/blacklist/hg38-blacklist.v2.bed")}"

# ---------------------------------------------------------------- 注释
: "${GTF:=$(first_existing \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab10/refs/gencode.v43.annotation.gtf \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab10/refs/gencode.v43.annotation.gtf \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab11/refs/gencode.v43.annotation.gtf \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab11/refs/gencode.v43.annotation.gtf \
    "$PROJECT_ROOT/reference/annotation/gencode.v43.annotation.gtf")}"

# ---------------------------------------------------------------- motif 库
# JASPAR 2022 脊椎动物非冗余核心库，meme-chip 和 TOBIAS BINDetect 共用
: "${MOTIF_DB:=$(first_existing \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab11/refs/JASPAR2022_CORE_vertebrates_non-redundant_v2.meme \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab11/refs/JASPAR2022_CORE_vertebrates_non-redundant_v2.meme \
    "$PROJECT_ROOT/reference/motif/JASPAR2022_CORE_vertebrates_non-redundant_v2.meme")}"

# HOMER 自带的已知 motif 库（-mknown 用；不给就会做从头 discovery，多跑几小时）
: "${HOMER_MOTIFS:=$(first_existing \
    /home/biotools/miniforge3/envs/motif/share/homer/data/knownTFs/known.motifs \
    /home/biotools/miniforge3/envs/homer/share/homer/data/knownTFs/known.motifs \
    /opt/conda/envs/motif/share/homer/data/knownTFs/known.motifs \
    "$PROJECT_ROOT/reference/motif/known.motifs")}"

# ---------------------------------------------------------------- MACS2
# hs = 人类有效基因组大小（2.7e9）。MACS2 内置别名，不要写 2.7e9
: "${EFFECTIVE_GENOME:=hs}"
# hg38 的 chromosome sizes：有 .fai 就现生成，没有就留空由脚本从 BAM header 取
: "${CHROM_SIZES:=$(first_existing \
    "$PROJECT_ROOT/reference/genome/hg38.chrom.sizes" \
    /public/workspace/shaojf/Course/NGS/wkdir4labs/lab10/refs/hg38.chrom.sizes \
    /public/storage/shaojf/Course/NGS/wkdir4labs/lab10/refs/hg38.chrom.sizes)}"

#!/usr/bin/env bash
# =============================================================================
#  config/pipeline.conf —— 默认值（用户主要改这个文件）
#
#  优先级：命令行参数  >  环境变量  >  本文件  >  代码内置兜底
#  写法用 ${VAR:=...}，所以环境变量里已有的值不会被覆盖。
#
#  分三层，模仿 snakePipes 的 defaults.yaml + organisms/*.yaml：
#    1. 物种/参考数据  →  config/genomes/<name>.conf
#    2. 运行参数与阈值 →  本文件
#    3. 单次覆盖       →  命令行
# =============================================================================

# ---------------------------------------------------------------- 物种
# 换物种：新增 config/genomes/<name>.conf，然后 --genome <name>
: "${GENOME:=hg38}"
# shellcheck source=/dev/null
source "$PROJECT_ROOT/config/genomes/${GENOME}.conf"

# ---------------------------------------------------------------- 输入输出
: "${OUTDIR:=./results}"
: "${THREADS:=20}"
: "${SAMPLE:=}"                    # 留空则从文件名推导

# ---------------------------------------------------------------- 比对
: "${BOWTIE2_PRESET:=--very-fast-local}"   # 课程脚本用的档位；最准是 --very-sensitive-local
: "${MIN_MAPQ:=20}"                        # samtools view -q
: "${DROP_MT:=1}"                          # 1=丢掉 chrM/MT 的 reads
: "${MT_NAMES:=chrM MT chrMT}"             # 不同参考的线粒体命名

# ---------------------------------------------------------------- Tn5 偏移
# Tn5 切开后留下 9 bp 的缺口，正链 +4 / 负链 -5 才是真实的插入位点
: "${ATAC_SHIFT:=1}"                       # 1=跑 alignmentSieve --ATACshift
: "${READ_SHIFT:=4 -5}"                    # 给 TOBIAS ATACorrect 用

# ---------------------------------------------------------------- 片段分档
# 单核小体约 147 bp 缠绕长度，所以 NFR < 147、mono 147-294、multi > 294
: "${NFR_MAX:=147}"
: "${MONO_MAX:=294}"

# ---------------------------------------------------------------- peak calling
: "${PEAK_CALLER:=macs2}"                  # macs2（目前只实现这一个）
: "${MACS2_QVALUE:=0.05}"
: "${PEAK_FORMAT:=BAMPE}"                  # 双端数据必须用 BAMPE
: "${TOPPEAKS_N:=10000}"                   # motif 分析取 top N 个 peak

# ---------------------------------------------------------------- 富集图
: "${BIGWIG_BINSIZE:=1}"
: "${BIGWIG_NORMALIZE:=CPM}"
: "${PROFILE_FLANK:=2000}"                 # TSS 上下游各 2 kb
: "${PROFILE_BINSIZE:=50}"

# ---------------------------------------------------------------- 结论判定阈值
# 这些数字决定 summary.txt 里每一项是 PASS / WARN / FAIL，也决定最后的结论段
# 参考：ENCODE ATAC-seq 标准 + 课程讲义的判定表
: "${MITO_MAX_PCT:=20}"                    # chrM 占比上限(%)，>20 判 FAIL
: "${MITO_GOOD_PCT:=5}"                    # <5 优秀
: "${FRIP_MIN:=0.20}"                      # FRiP 下限，ENCODE 建议 >0.2
: "${FRIP_GOOD:=0.30}"                     # >0.3 优秀
: "${TSS_ENRICH_MIN:=5}"                   # TSS enrichment 下限，ENCODE ≥5
: "${PEAKS_MIN:=10000}"                    # peak 数下限
: "${MAP_RATE_MIN:=80}"                    # 比对率下限(%)

# ---------------------------------------------------------------- 可选步骤
# 这些步骤依赖额外软件（HOMER / MEME / R 包 / TOBIAS），缺了就跳过并 WARN，
# 不影响主流程出结果
: "${RUN_MOTIF:=1}"                        # ⑬ HOMER motif 富集
: "${RUN_MEME:=0}"                         # MEME motif（很慢，默认关）
: "${RUN_ATACQC:=1}"                       # ⑭ 片段分布 + TSSE（内置实现，不依赖 R）
: "${RUN_CHIPPEAKANNO:=0}"                 # R 包 ChIPpeakAnno 注释
: "${RUN_TOBIAS:=0}"                       # TOBIAS footprint

# ---------------------------------------------------------------- IGV
# MYC 在 GRCh38 上的位置：chr8:127,735,434-127,742,951
: "${IGV_REGION:=chr8:127730000-127745000}"
: "${IGV_GENE:=MYC}"

# ---------------------------------------------------------------- 外部环境
: "${EXTRA_PATH:=/bioapps/bin:/home/biotools/miniforge3/envs/motif/bin:/home/biotools/miniforge3/envs/gatk/bin}"

#!/usr/bin/env bash
# =============================================================================
#  config/atac.conf —— 默认值（用户主要改这个文件）
#
#  优先级：命令行参数  >  环境变量  >  本文件  >  代码内置兜底
#  标量用 ${VAR:=...}，所以环境变量里已有的值不会被覆盖。
#  数组（*_OPTS / DROP_CONTIGS）不能用 :=，用 +x 判断是否已被设置。
#
#  路径默认全部指向项目内的 reference/ 和 extratools/，
#  跑完 deploy/deploy.sh 之后不需要改任何东西就能直接跑。
# =============================================================================

# ---------------------------------------------------------------- 运行参数
: "${OUTDIR:=./results}"
: "${THREADS:=8}"
: "${SORT_MEM:=2G}"                 # 单个 samtools sort 线程的内存
: "${KEEP_SAM:=1}"                  # 1=保留 ③ 的 SAM（作业要求看到产物）；0=管道省磁盘
# alignmentSieve 每个线程开一个临时 BAM，线程多了会撞文件句柄上限
: "${SIEVE_THREADS:=16}"            # 实际取 min(SIEVE_THREADS, THREADS)

# ---------------------------------------------------------------- 参考数据
# 留空则自动探测 reference/ 下有什么，不看固定文件名
: "${GENOME:=}"
: "${BT2:=}"
: "${GTF:=}"
: "${BLACKLIST:=}"

: "${HOMER_GENOME:=hg38}"
: "${HOMER_MOTIFS:=}"
# 没指定就找 HOMER 安装目录下的 known.motifs
if [[ -z "$HOMER_MOTIFS" ]]; then
  HOMER_MOTIFS=$(first_existing \
      "$PROJECT_ROOT/extratools/homer/data/knownTFs/known.motifs" \
      /home/biotools/miniforge3/envs/motif/share/homer/data/knownTFs/known.motifs)
fi

# ---------------------------------------------------------------- 阈值
: "${MIN_MAPQ:=20}"                 # ④ samtools view -q 20
: "${TLEN_NFR_MAX:=147}"            # ⑦ NFR 上界（一个核小体的缠绕长度）
: "${TLEN_MONO_MAX:=294}"           # ⑦ 单核小体上界（两个核小体）
: "${MACS2_QVALUE:=0.05}"           # ⑧
: "${MACS2_GSIZE:=hs}"              # hs = human；按实际有效基因组大小传
: "${MOTIF_TOPN:=10000}"            # ⑬ 只用信号最强的 1 万个 peak
: "${MOTIF_SIZE:=200}"              # ⑬ motif 搜索窗口
: "${MOTIF_THREADS:=8}"             # ⑬ findMotifsGenome.pl -p，实际取 min(MOTIF_THREADS, THREADS)
# ⑬ 是否同时做 de novo motif discovery：0=只比对已知库（几分钟），
# 1=额外做从头发现（1–2 小时/路线，只多出 homerResults.html）
: "${MOTIF_DENOVO:=0}"

# ---------------------------------------------------------------- bigWig / TSS
: "${BW_BINSIZE:=10}"
: "${BW_NORM:=CPM}"                 # CPM | RPKM | BPM | RPGC | None
: "${IGNORE_FOR_NORM:=}"            # 例如 chrM；留空则不忽略
: "${TSS_FLANK:=2000}"              # ±2 kb
: "${TSS_BIN:=25}"                  # 25 bp 一个 bin → 160 个 bin
: "${TSS_WINDOW:=50}"               # TSS 中心 ±50 bp 算信号

# ---------------------------------------------------------------- ⑭ ATACseqQC
# TSSE 要全基因组算出来的数才有意义，所以默认 ""（全基因组）。
# 只想要个快速预览就填 chr1。
: "${ATACQC_REGION:=}"
# 核小体分档 / heatmap / 足迹是逐 fragment 的操作，还要算 conservation，
# 全基因组会跑很久；默认只取一条染色体做这套图。
: "${ATACQC_DEMO_REGION:=chr1}"
# CTCF 足迹：要 BSgenome + ④ 的 shift.bam（会顺手建索引）+ ⑨ 的 peak。
# 关掉能省 3–5 分钟，且不影响其它指标。
: "${ATACQC_FOOTPRINT:=1}"

# ---------------------------------------------------------------- IGV
: "${IGV_LOCUS:=chr8:127735000-127742000}"   # MYC, hg38
: "${IGV_WIDTH:=1400}"
: "${IGV_HEIGHT:=900}"
: "${IGV_TIMEOUT:=600}"                      # 秒；batch 模式卡住时别拖死整条链
# 截图里要不要加载基因模型：auto=有 GTF 就加载（首次载入慢 1–3 分钟）、
# 0=不加载（图更小更快）、其他值=当成 GTF 路径
: "${IGV_GENE_TRACK:=auto}"

# ---------------------------------------------------------------- 外部环境
# 课程服务器的工具目录；不存在时自动忽略
: "${EXTRA_PATH:=/bioapps/bin:/home/biotools/miniforge3/envs/motif/bin}"

# =============================================================================
#  命令选项（数组形式，避免空格被 IFS 吃掉）
# =============================================================================

# ② fastp
#   --detect_adapter_for_pe  双端自动检测接头
#   -q 15 / -u 40 / -l 30    不压到 20 以上，否则 Tn5 插入位点附近的低质量
#                            碱基被削掉，切割位点会偏移
#   不开 --trim_poly_g        非 NovaSeq 建库没有 polyG 偏好
if [[ -z "${FASTP_OPTS+x}" ]]; then
  FASTP_OPTS=(--detect_adapter_for_pe -q 15 -u 40 -l 30)
fi

# ③ bowtie2
#   --local --very-fast-local  允许局部比对，救回在接头处截断的 reads
#   --no-mixed --no-discordant 只留正常配对
#   -X 2000                    双端间距上限，设小了会丢跨核小体的长片段
if [[ -z "${BT2_OPTS+x}" ]]; then
  BT2_OPTS=(--local --very-fast-local --no-mixed --no-discordant --phred33 -X 2000)
fi

# ④ 要丢掉的 contig，支持 * 通配。chrM 必须丢：ATAC 建库里线粒体
#   会被 Tn5 一起打碎，占比 20–30% 是常态，不去掉 peak 会大量堆在 mtDNA 上
if [[ -z "${DROP_CONTIGS+x}" ]]; then
  DROP_CONTIGS=("chrM" "chrM_alt" "chrUn*" "*_random" "*_alt")
fi

# ⑧ MACS2：-f BAMPE 已经用真实片段跨度，不能再传 --shift/--extsize
#   （BAMPE 模式下 MACS2 会把它们强制归零，传了静默无效）
if [[ -z "${MACS2_OPTS+x}" ]]; then
  MACS2_OPTS=(--nomodel --keep-dup all)
fi

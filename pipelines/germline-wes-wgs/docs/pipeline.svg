<text x="32" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#111827">germline-wes-wgs</text>
<text x="32" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6B7280">单样本 WES / WGS 胚系变异检测 · 7 个阶段 · 3 个 caller 与 3 个注释器自由组合</text>
<text x="968" y="48" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#9CA3AF">NGSpipeline / pipelines</text>

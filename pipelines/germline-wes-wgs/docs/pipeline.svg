<text x="48" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#374151">⑤ 变异检测 —— 三选一，或 <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7C3AED">-c all</tspan> 全跑后自动做一致性对比</text>

<rect x="52" y="296" width="300" height="104" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
<text x="68" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#5B21B6">bcftools</text>
<text x="68" y="341" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">mpileup -d 1000 -a AD,DP</text>
<text x="68" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">call -mv</text>
<text x="68" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">filter 'QUAL&gt;10 &amp;&amp; DP&gt;10'</text>
<text x="68" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7C3AED">轻量 · 不需要额外参考库</text>

<rect x="348" y="296" width="300" height="104" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
<text x="364" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#5B21B6">GATK</text>
<text x="364" y="341" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">HaplotypeCaller -ERC GVCF</text>
<text x="364" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">GenotypeGVCFs → NVScoreVariants</text>
<text x="364" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">FilterVariantTranches 99.95 / 99.4</text>
<text x="364" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7C3AED">最严谨 · 需要 GATK bundle</text>

<rect x="644" y="296" width="300" height="104" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
<text x="660" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#5B21B6">DeepVariant</text>
<text x="660" y="341" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">singularity exec … run_deepvariant</text>
<text x="660" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">--model_type=WES | WGS</text>
<text x="660" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#52525B">--vcf_stats_report=true</text>
<text x="660" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7C3AED">深度学习模型 · indel 更稳</text>


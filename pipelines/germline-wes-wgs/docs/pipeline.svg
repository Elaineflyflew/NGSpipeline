<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="ttl dsc">
<title id="ttl">germline-wes-wgs 流水线结构</title>
<desc id="dsc">从双端 FASTQ 或 BAM 开始，经过质控、修剪、比对、BAM 精修四个上游步骤，进入三条可选的变异检测路线，再做注释，最后输出汇总报告与 IGV 批处理脚本。</desc>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>


#!/usr/bin/env bash
# =============================================================================
#  config/pipeline.conf —— 默认值（用户主要改这个文件）
#
#  优先级：命令行参数  >  环境变量  >  本文件  >  代码内置兜底
#  写法用 ${VAR:=...}，所以环境变量里已有的值不会被覆盖。
#
#  路径默认全部指向项目内的 reference/ 和 extratools/，
#  跑完 deploy/deploy.sh 之后不需要改任何东西就能直接跑。
# =============================================================================

# ---------------------------------------------------------------- 参考数据
# 参考基因组：reference/genome/ 下哪个 fasta 带索引就用哪个，不看文件名。
# Broad 版（Homo_sapiens_assembly38.fasta）、Ensembl 版、你自己重命名的都行。
# 想用别处的：-r /path/to/ref.fa，或 export REF=...
: "${REF:=$(discover_ref)}"
# 课程服务器上那份参考（如果存在）作为最后兜底
if [[ -z "$REF" ]]; then
  REF=$(first_existing \
        /public/workspace/shaojf/Course/NGS/wkdir4labs/lab5/refs/Homo_sapiens.GRCh38.dna.primary_assembly.fa)
fi

# WES 捕获区间：留空则自动取 reference/bed 下第一个 .bed；都没有就做全基因组
: "${BED:=}"
if [[ -z "$BED" && -d "$PROJECT_ROOT/reference/bed" ]]; then
  for _b in "$PROJECT_ROOT/reference/bed"/*.bed; do
    [[ -f "$_b" ]] && { BED="$_b"; break; }
  done
  unset _b
fi

: "${BUNDLE:=$PROJECT_ROOT/reference/gatk_bundle}"
: "${VEP_CACHE:=$PROJECT_ROOT/reference/vep}"
: "${VEP_ASSEMBLY:=GRCh38}"
: "${ANNOVAR_DB:=$PROJECT_ROOT/extratools/annovar/humandb}"
: "${ANNOVAR_PROTOCOLS:=refGene,cytoBand,exac03,gnomad30_genome,avsnp150,dbnsfp42a}"
: "${ANNOVAR_OPS:=g,r,f,f,f,f}"

# Funcotator 数据源：自动取 reference/funcotator 下的第一个子目录
: "${FUNCOTATOR_DATA:=}"
if [[ -z "$FUNCOTATOR_DATA" && -d "$PROJECT_ROOT/reference/funcotator" ]]; then
  for _d in "$PROJECT_ROOT/reference/funcotator"/*/; do
    [[ -d "$_d" ]] && { FUNCOTATOR_DATA="${_d%/}"; break; }
  done
  unset _d
fi

# DeepVariant：有 sif 就走 singularity，没有就用本机 run_deepvariant
: "${DV_SIF:=$(first_existing \
      "$PROJECT_ROOT/extratools/deepvariant/deepvariant.sif" \
      "$PROJECT_ROOT/extratools/deepvariant/deepvariant.sif.gz")}"
: "${DV_BIND:=$PROJECT_ROOT/}"     # singularity 需要绑定的父目录
: "${DV_MODEL:=WES}"               # WES | WGS

# ---------------------------------------------------------------- 运行参数
: "${OUTDIR:=./results}"
: "${THREADS:=8}"
: "${CALLER:=bcftools}"            # bcftools | gatk | deepvariant | all
: "${ANNOTATOR:=none}"             # vep | annovar | funcotator | none | all
: "${MIN_MAPQ:=20}"                # 对应 samtools view -q 20
: "${MIN_QUAL:=10}"                # bcftools filter QUAL>10
: "${MIN_DP:=10}"                  # bcftools filter DP>10
: "${JAVA_MEM:=16g}"

# ---------------------------------------------------------------- IGV
: "${IGV_REGION:=chr17:7668402-7687550}"   # TP53, GRCh38
: "${IGV_MAX:=6}"                          # 候选位点最多截几张

# ---------------------------------------------------------------- 外部环境
# 课程服务器的工具目录；不存在时自动忽略
: "${EXTRA_PATH:=/bioapps/bin:/home/biotools/miniforge3/envs/gatk/bin}"
